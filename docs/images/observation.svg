<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">How the game becomes structured state</title><desc id="desc">Synthetic corner snapshot. The bridge reads collision bodies, velocity, state and input timing. The compact JSON uses coordinates relative to the knight.</desc><rect width="1120" height="600" fill="#101722"/><style>text{font-family:Arial,sans-serif}.mono{font-family:Consolas,monospace}</style><text x="40" y="36" font-size="14" fill="#81ddd2" font-weight="700" text-anchor="start">01 / OBSERVE</text><text x="40" y="78" font-size="32" fill="#f2efe7" font-weight="650" text-anchor="start">The game becomes geometry + state</text><text x="40" y="111" font-size="18" fill="#a6b3c5" font-weight="400" text-anchor="start">The native bridge reads Unity objects. This integration sends structured JSON to Jev.</text><rect x="40" y="142" width="540" height="365" rx="10" fill="#172130" stroke="none" stroke-width="1" opacity="1"/><defs><clipPath id="arena-clip"><rect x="40" y="142" width="540" height="365" rx="10"/></clipPath></defs><g clip-path="url(#arena-clip)"><line x1="117" y1="175" x2="117" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="162" y1="175" x2="162" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="207" y1="175" x2="207" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="252" y1="175" x2="252" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="297" y1="175" x2="297" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="342" y1="175" x2="342" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="387" y1="175" x2="387" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="432" y1="175" x2="432" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="477" y1="175" x2="477" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="522" y1="175" x2="522" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="567" y1="175" x2="567" y2="441" stroke="#2c3a4d" stroke-width="1" opacity="1"/><line x1="72" y1="183" x2="72" y2="441" stroke="#f2efe7" stroke-width="3" opacity="1"/><line x1="72" y1="441" x2="556" y2="441" stroke="#f2efe7" stroke-width="3" opacity="1"/><rect x="297.0" y="261" width="315" height="180" rx="8" fill="none" stroke="#f4bc73" stroke-width="2" opacity="0.7" stroke-dasharray="7 7"/><rect x="72.0" y="351" width="45" height="90" rx="0" fill="none" stroke="#81ddd2" stroke-width="2" opacity="1"/><rect x="387.0" y="351" width="135" height="90" rx="0" fill="none" stroke="#ff968d" stroke-width="2" opacity="1"/><g transform="translate(94.5,396) scale(1.2)" opacity="1"><path d="M-14,-3 Q0,-14 14,-3 L19,22 L5,16 L-3,24 L-19,19 Z" fill="#91b2ff"/><path d="M-15,-12 Q-21,-25 -17,-34 L-10,-22 Q0,-27 10,-22 L17,-34 Q21,-25 15,-12 Q17,5 0,6 Q-17,5 -15,-12Z" fill="#f2efe7"/><ellipse cx="-6" cy="-10" rx="3" ry="5" fill="#101722" stroke="none" stroke-width="1"/><ellipse cx="6" cy="-10" rx="3" ry="5" fill="#101722" stroke="none" stroke-width="1"/><line x1="-7" y1="20" x2="-9" y2="28" stroke="#f2efe7" stroke-width="3" opacity="1"/><line x1="7" y1="20" x2="10" y2="27" stroke="#f2efe7" stroke-width="3" opacity="1"/></g><g transform="translate(454.5,396) scale(1.25)" opacity="1"><ellipse cx="-17" cy="-23" rx="24" ry="11" fill="#536477" stroke="#a6b3c5" stroke-width="1"/><ellipse cx="17" cy="-23" rx="24" ry="11" fill="#536477" stroke="#a6b3c5" stroke-width="1"/><ellipse cx="0" cy="1" rx="44" ry="28" fill="#766c83" stroke="#ff968d" stroke-width="2"/><path d="M-12,-24 Q-1,0 -10,27 M12,-24 Q23,0 14,26" fill="none" stroke="#101722" stroke-width="3"/><circle cx="-32" cy="-5" r="4" fill="#f2efe7" opacity="1"/><circle cx="-32" cy="-5" r="2" fill="#101722" opacity="1"/><line x1="-20" y1="25" x2="-28" y2="34" stroke="#a6b3c5" stroke-width="3" opacity="1"/><line x1="3" y1="28" x2="0" y2="35" stroke="#a6b3c5" stroke-width="3" opacity="1"/><line x1="28" y1="22" x2="32" y2="32" stroke="#a6b3c5" stroke-width="3" opacity="1"/></g><text x="95" y="197" font-size="14" fill="#81ddd2" font-weight="700" text-anchor="start">KNIGHT</text><text x="95" y="225" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start">Grounded; jump released</text><text x="95" y="250" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start">Left movement is blocked</text><text x="325" y="288" font-size="14" fill="#ff968d" font-weight="700" text-anchor="start">GRUZ MOTHER</text><text x="325" y="314" font-size="20" fill="#f2efe7" font-weight="600" text-anchor="start">Charge Antic</text><text x="325" y="338" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">vx = 0 during windup</text><line x1="125" y1="479" x2="406" y2="479" stroke="#81ddd2" stroke-width="2" opacity="1"/><polyline points="397.22,483.79 406.00,479.00 397.22,474.21" fill="none" stroke="#81ddd2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="266" y="471" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="middle">6 units between bodies</text></g><text x="606" y="166" font-size="22" fill="#f2efe7" font-weight="600" text-anchor="start">A compact view sent to Jev</text><text x="606" y="204" font-size="17" fill="#81ddd2" font-weight="400" text-anchor="start" class="mono">player</text><text x="606" y="229" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  grounded: true</text><text x="606" y="254" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  blocked_left: true</text><text x="606" y="279" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  facing: 1</text><text x="606" y="304" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">held.jump: false</text><text x="606" y="329" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono"></text><text x="606" y="354" font-size="17" fill="#ff968d" font-weight="400" text-anchor="start" class="mono">enemies[0]</text><text x="606" y="379" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  state: &quot;Charge Antic&quot;</text><text x="606" y="404" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  state_elapsed_seconds: 0.45</text><text x="606" y="429" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  left: 6.5, right: 9.5</text><text x="606" y="454" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">  vx: 0, vy: 0</text><text x="606" y="479" font-size="17" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">nearest_enemy.body_gap: 6</text><line x1="40" y1="532" x2="1080" y2="532" stroke="#2c3a4d" stroke-width="2" opacity="1"/><text x="40" y="561" font-size="17" fill="#81ddd2" font-weight="400" text-anchor="start">Solid boxes = collision bodies</text><text x="420" y="561" font-size="17" fill="#f4bc73" font-weight="400" text-anchor="start">Dashed zone = extra clearance, not a larger hitbox</text></svg>