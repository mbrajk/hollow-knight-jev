<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">One state, two Jev Choice questions, one finite input command</title><desc id="desc">Movement and strike see the same state independently. The response shown is illustrative. The controller maps still_jump and none to move0 jumptrue attackfalse with a maximum300ms lease.</desc><rect width="1120" height="590" fill="#101722"/><style>text{font-family:Arial,sans-serif}.mono{font-family:Consolas,monospace}</style><text x="40" y="36" font-size="14" fill="#81ddd2" font-weight="700" text-anchor="start">03 / ASK JEV</text><text x="40" y="78" font-size="32" fill="#f2efe7" font-weight="650" text-anchor="start">One state. Two decisions. One set of buttons.</text><text x="40" y="111" font-size="18" fill="#a6b3c5" font-weight="400" text-anchor="start">Measured facts + projected outcomes + goal + descriptions of the available controls</text><rect x="40" y="145" width="1040" height="51" rx="8" fill="#172130" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="177" font-size="19" fill="#81ddd2" font-weight="600" text-anchor="start" class="mono">state</text><text x="160" y="177" font-size="18" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">player  ·  enemies  ·  input_physics  ·  attack_window  ·  forecast</text><line x1="300" y1="202" x2="300" y2="227" stroke="#c3abff" stroke-width="3" opacity="1"/><polyline points="295.21,218.22 300.00,227.00 304.79,218.22" fill="none" stroke="#c3abff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><line x1="820" y1="202" x2="820" y2="227" stroke="#c3abff" stroke-width="3" opacity="1"/><polyline points="815.21,218.22 820.00,227.00 824.79,218.22" fill="none" stroke="#c3abff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="60" y="263" font-size="19" fill="#c3abff" font-weight="650" text-anchor="start">MOVEMENT / Choice</text><text x="606" y="263" font-size="19" fill="#c3abff" font-weight="650" text-anchor="start">STRIKE / Choice</text><text x="60" y="295" font-size="19" fill="#f2efe7" font-weight="400" text-anchor="start">Which available movement avoids contact?</text><text x="606" y="295" font-size="19" fill="#f2efe7" font-weight="400" text-anchor="start">Which available nail strike can connect?</text><text x="60" y="326" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">left · still · right · jump / repress variants</text><text x="606" y="326" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">none · current facing · up · airborne down</text><line x1="40" y1="350" x2="1080" y2="350" stroke="#2c3a4d" stroke-width="2" opacity="1"/><text x="60" y="382" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">Illustrative answer distribution</text><text x="60" y="414" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">still_jump</text><rect x="196" y="398" width="126.50000000000001" height="18" rx="3" fill="#81ddd2" stroke="none" stroke-width="1" opacity="1"/><text x="437" y="413" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start">55%</text><text x="60" y="445" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">right_jump</text><rect x="196" y="429" width="46.0" height="18" rx="3" fill="#91b2ff" stroke="none" stroke-width="1" opacity="1"/><text x="437" y="444" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start">20%</text><text x="60" y="476" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start" class="mono">other 7</text><rect x="196" y="460" width="57.5" height="18" rx="3" fill="#2c3a4d" stroke="none" stroke-width="1" opacity="1"/><text x="437" y="475" font-size="16" fill="#f2efe7" font-weight="400" text-anchor="start">25%</text><text x="606" y="407" font-size="23" fill="#81ddd2" font-weight="600" text-anchor="start" class="mono">choice: none</text><text x="606" y="441" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">The boss is outside nail reach in this snapshot.</text><text x="606" y="471" font-size="16" fill="#a6b3c5" font-weight="400" text-anchor="start">Each question sees the state, not the other answer.</text><line x1="300" y1="490" x2="300" y2="514" stroke="#81ddd2" stroke-width="3" opacity="1"/><polyline points="295.21,505.22 300.00,514.00 304.79,505.22" fill="none" stroke="#81ddd2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><line x1="820" y1="490" x2="820" y2="514" stroke="#81ddd2" stroke-width="3" opacity="1"/><polyline points="815.21,505.22 820.00,514.00 824.79,505.22" fill="none" stroke="#81ddd2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="40" y="520" width="1040" height="47" rx="8" fill="#172130" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="551" font-size="20" fill="#f2efe7" font-weight="600" text-anchor="start" class="mono">move: 0    jump: true    attack: false</text><text x="788" y="551" font-size="19" fill="#81ddd2" font-weight="600" text-anchor="start">lease ≤ 300 ms</text></svg>